services:
  web:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN=https://your-domain in the server environment}
      APP_DB: /data/drunken-guide.sqlite3
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - drunken-guide-data:/data
volumes:
  drunken-guide-data:
